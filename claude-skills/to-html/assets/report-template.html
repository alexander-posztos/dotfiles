<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<style>
  :root {
    --measure: 68ch;
    --sidebar-w: 200px;
    --gap: 64px;

    --bg: oklch(1 0 0);
    --surface: oklch(0.966 0.006 220);
    --text: oklch(0.24 0.014 240);
    --heading: oklch(0.16 0.016 240);
    --muted: oklch(0.52 0.046 230);
    --steel: oklch(0.50 0.088 225);
    --rule: oklch(0.895 0.010 230);
    --hairline: oklch(0.935 0.007 230);
    --mark: oklch(0.50 0.088 225 / 0.14);
    --ok: oklch(0.52 0.10 155);
    --no: oklch(0.55 0.13 25);

    --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    --sans: "Avenir Next", Avenir, Corbel, "Segoe UI", sans-serif;
    --mono: Menlo, "SF Mono", "Cascadia Mono", Consolas, monospace;

    --leading: 1.66;
    --tracking: 0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.12 0 0);
      --surface: oklch(0.175 0.010 230);
      --text: oklch(0.895 0.010 230);
      --heading: oklch(0.965 0.006 230);
      --muted: oklch(0.68 0.044 230);
      --steel: oklch(0.72 0.082 225);
      --rule: oklch(0.30 0.012 230);
      --hairline: oklch(0.225 0.008 230);
      --mark: oklch(0.72 0.082 225 / 0.2);
      --ok: oklch(0.74 0.13 155);
      --no: oklch(0.72 0.15 25);

      --leading: 1.72;
      --tracking: 0.004em;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    font-size: 1.0625rem;
    font-feature-settings: "kern", "liga";
    line-height: var(--leading);
    letter-spacing: var(--tracking);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--mark); }

  :focus-visible {
    outline: 2px solid var(--steel);
    outline-offset: 3px;
    border-radius: 1px;
  }

  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, var(--measure));
    column-gap: var(--gap);
    justify-content: center;
    padding: 76px 32px 128px;
  }

  /* Table of contents */
  .sidebar {
    position: sticky;
    top: 44px;
    align-self: start;
    max-height: calc(100vh - 88px);
    overflow-y: auto;
    font-family: var(--sans);
    font-size: 0.8125rem;
    line-height: 1.4;
    letter-spacing: 0;
  }
  .sidebar-title {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 14px 15px;
  }
  .sidebar ol {
    list-style: none;
    padding: 0;
    margin: 0;
    border-left: 1px solid var(--hairline);
  }
  .sidebar li { margin: 0; }
  .sidebar a {
    color: var(--muted);
    text-decoration: none;
    display: block;
    padding: 6px 0 6px 14px;
    border-left: 1px solid transparent;
    margin-left: -1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .sidebar a:hover { color: var(--text); }
  .sidebar a.active {
    color: var(--heading);
    border-left-color: var(--steel);
  }

  main { min-width: 0; }

  /* Masthead */
  h1 {
    font-size: clamp(2.05rem, 1.1rem + 4.6vw, 4.25rem);
    font-weight: 900;
    color: var(--heading);
    line-height: 0.96;
    letter-spacing: -0.035em;
    text-wrap: balance;
    overflow-wrap: break-word;
    margin: 0 0 20px;
  }
  .meta {
    font-family: var(--sans);
    font-size: 0.8125rem;
    letter-spacing: 0;
    color: var(--muted);
    margin: 0 0 36px;
    padding-bottom: 14px;
    border-bottom: 3px solid var(--steel);
  }
  .meta .kind { color: var(--text); font-weight: 500; }
  .meta .sep { padding: 0 9px; color: var(--rule); }

  h2, h3 {
    color: var(--heading);
    line-height: 1.15;
  }
  h2 {
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: -0.028em;
    text-wrap: balance;
    margin: 0 0 0.85rem;
  }
  h3 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.008em;
    margin: 2.2rem 0 0.5rem;
  }
  section > h2:first-child { margin-top: 0; }

  p { margin: 0 0 1rem; }
  strong { font-weight: 700; color: var(--heading); }

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--mark);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s ease;
  }
  a:hover { text-decoration-color: var(--steel); }

  code {
    font-family: var(--mono);
    font-size: 0.78em;
    color: var(--text);
    background: var(--surface);
    padding: 0.15em 0.35em;
    border-radius: 2px;
    letter-spacing: 0;
    overflow-wrap: anywhere;
  }

  pre {
    background: var(--surface);
    border-radius: 3px;
    padding: 16px 18px;
    overflow-x: auto;
    margin: 0 0 1rem;
    line-height: 1.55;
  }
  pre code {
    background: none;
    padding: 0;
    white-space: pre;
    overflow-wrap: normal;
    font-size: 0.76rem;
  }

  /* Tables: instrument ruling, tabular figures, no filled header band */
  .table-wrap { overflow-x: auto; margin: 1.7rem 0; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--sans);
    font-size: 0.8125rem;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  th, td {
    padding: 9px 16px 9px 0;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--hairline);
  }
  th {
    font-weight: 500;
    color: var(--muted);
    border-bottom: 2px solid var(--steel);
    padding-bottom: 7px;
  }
  th:last-child, td:last-child { padding-right: 0; }
  .num { text-align: right; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.total td {
    font-weight: 600;
    color: var(--heading);
    border-top: 1px solid var(--rule);
  }

  hr { border: none; height: 1px; background: var(--rule); margin: 2.4rem 0; }

  ul, ol { padding-left: 1.15em; margin: 0 0 1rem; }
  li { margin: 0.4rem 0; }
  li::marker { color: var(--muted); }
  li > p { margin: 0 0 0.5rem; }
  li > ul, li > ol { margin-top: 0.4rem; }

  /* Ranked findings where the order carries meaning */
  ol.numbered { counter-reset: item; list-style: none; padding-left: 0; }
  ol.numbered > li {
    counter-increment: item;
    position: relative;
    padding-left: 2.3rem;
    margin: 0.85rem 0;
  }
  ol.numbered > li::before {
    content: counter(item);
    position: absolute;
    left: 0;
    top: 0.28em;
    width: 1.5rem;
    text-align: right;
    color: var(--steel);
    font-family: var(--sans);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 0;
  }

  blockquote {
    margin: 1.5rem 0;
    padding-left: 1.2rem;
    border-left: 1px solid var(--rule);
    color: var(--muted);
    font-style: italic;
  }

  /* Aside for caveats, method notes, limitations */
  .note {
    margin: 1.7rem 0;
    padding: 2px 0 2px 1.2rem;
    border-left: 1px solid var(--steel);
    font-size: 0.95rem;
    color: var(--muted);
  }
  .note p:last-child, .note ul:last-child { margin-bottom: 0; }

  /* One discrete, decidable proposal. Only use these when the document really is
     a list of proposals - their presence is what turns on the accept/reject controls. */
  .proposal {
    margin: 2.2rem 0;
    padding-left: 1.15rem;
    border-left: 2px solid var(--rule);
    transition: border-color 0.15s ease, opacity 0.15s ease;
  }
  .proposal > :first-child { margin-top: 0; }
  .proposal[data-dec="accept"] { border-left-color: var(--ok); }
  .proposal[data-dec="reject"] { border-left-color: var(--no); opacity: 0.5; }
  .proposal .loc {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--muted);
    margin-left: 0.6em;
  }
  /* Label over a before/after pair */
  .lbl {
    font-family: var(--sans);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--muted);
    margin: 1.1rem 0 0.35rem;
  }
  pre.before code { color: var(--muted); }
  pre.after { background: var(--mark); }

  /* Base64-embedded screenshots */
  figure.shot { margin: 1.9rem 0; }
  figure.shot img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--hairline);
    border-radius: 3px;
  }

  /* Inline-SVG charts and diagrams */
  figure.chart { margin: 2.1rem 0; }
  figure.chart svg { display: block; width: 100%; height: auto; overflow: visible; }

  figcaption {
    font-family: var(--sans);
    font-size: 0.78rem;
    line-height: 1.45;
    letter-spacing: 0;
    color: var(--muted);
    margin-top: 10px;
  }

  /* Lede: the 3-6 bullets a reader could stop after */
  .tldr {
    margin: 0 0 1rem;
    padding: 0;
  }
  .tldr-label {
    font-family: var(--sans);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--heading);
    margin: 0 0 0.75rem;
  }
  .tldr ul { margin: 0; padding-left: 1.1em; }
  .tldr li { margin: 0.7rem 0; font-size: 1.24rem; line-height: 1.45; color: var(--heading); }
  .tldr li::marker { color: var(--steel); }

  section[id^="s-"] {
    scroll-margin-top: 44px;
    margin-top: 3.6rem;
    padding-top: 1.4rem;
    border-top: 2px solid var(--steel);
  }

  @media (min-width: 961px) {
    html { scroll-behavior: smooth; }
  }

  @media (max-width: 960px) {
    .layout {
      grid-template-columns: minmax(0, 1fr);
      max-width: 42rem;
      margin: 0 auto;
      padding: 36px 24px 88px;
    }
    .sidebar {
      position: static;
      max-height: none;
      margin-bottom: 40px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--hairline);
    }
    .sidebar-title { margin-left: 0; }
    .sidebar ol { border-left: none; columns: 2; column-gap: 24px; }
    .sidebar a { padding-left: 0; border-left: none; margin-left: 0; }
    .sidebar a.active { border-left: none; color: var(--steel); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition-duration: 0.01ms !important; }
  }

  @media print {
    :root {
      --bg: #fff; --text: #000; --heading: #000; --muted: #444;
      --rule: #999; --hairline: #ccc; --surface: #f2f2f2;
      --steel: #000; --mark: transparent;
    }
    .sidebar { display: none; }
    .layout { display: block; padding: 0; max-width: none; }
    body { font-size: 10.5pt; }
    h1 { font-size: 20pt; }
    h2 { font-size: 13pt; page-break-after: avoid; }
    h3 { page-break-after: avoid; }
    section, figure, .tldr, .table-wrap, blockquote { page-break-inside: avoid; }
    a { text-decoration: none; }
  }
</style>
<style id="editor-style">
  /* Editor layer: inline editing, per-block comments, accept/reject on .proposal.
     For a read-only page, delete this element and the script element with
     id="editor" - nothing else in the file depends on either. */

  [data-ed] { position: relative; }
  [data-ed]:focus { outline: none; background: var(--mark); border-radius: 2px; }
  [data-ed][data-changed]::after {
    content: "";
    position: absolute;
    left: -14px;
    top: 0.15em;
    bottom: 0.15em;
    width: 2px;
    background: var(--steel);
    border-radius: 1px;
  }

  /* One floating toolbar, parked in the gutter of whichever block is hovered */
  #gutter {
    position: absolute;
    display: none;
    gap: 1px;
    z-index: 20;
    transform: translateX(-100%);
  }
  #gutter[data-on] { display: flex; }
  /* No gutter to sit in on narrow screens: park it above the block instead */
  #gutter[data-above] { transform: none; }
  #gutter button {
    font-family: var(--sans);
    font-size: 0.8rem;
    line-height: 1;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 4px 5px;
    cursor: pointer;
  }
  #gutter button:hover { color: var(--steel); border-color: var(--hairline); }
  #gutter button[hidden] { display: none; }

  .cmt {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 0.6rem 0 1.2rem;
    padding: 8px 10px;
    background: var(--surface);
    border-left: 2px solid var(--steel);
    border-radius: 0 3px 3px 0;
    font-family: var(--sans);
    font-size: 0.84rem;
    line-height: 1.5;
    letter-spacing: 0;
  }
  .cmt-body { flex: 1; min-width: 0; }
  .cmt-q { color: var(--muted); font-size: 0.78rem; margin: 0 0 4px; font-style: italic; }
  .cmt-in { outline: none; min-height: 1.5em; overflow-wrap: anywhere; }
  .cmt-in:empty::before { content: attr(data-ph); color: var(--muted); }
  .cmt-x {
    flex: none;
    font-family: var(--sans);
    font-size: 0.9rem;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: 0;
    padding: 2px 4px;
    cursor: pointer;
  }
  .cmt-x:hover { color: var(--no); }

  .dec { display: flex; gap: 6px; margin-top: 0.9rem; }
  .dec button {
    font-family: var(--sans);
    font-size: 0.75rem;
    letter-spacing: 0;
    color: var(--muted);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 3px 11px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .dec button:hover { color: var(--text); border-color: var(--muted); }
  .dec button[value="accept"][data-on] { color: var(--ok); border-color: var(--ok); }
  .dec button[value="reject"][data-on] { color: var(--no); border-color: var(--no); }

  #ed-bar {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 6px;
    box-shadow: 0 6px 22px oklch(0 0 0 / 0.14);
    font-family: var(--sans);
    font-size: 0.78rem;
    letter-spacing: 0;
    color: var(--muted);
  }
  #ed-bar button {
    font: inherit;
    color: var(--muted);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
  }
  #ed-bar button:hover { color: var(--text); border-color: var(--muted); }
  #ed-bar[data-dirty] #ed-out { color: var(--heading); }
  #ed-bar[data-dirty] button[data-a="copy"] { color: var(--bg); background: var(--steel); border-color: var(--steel); }

  .clip { position: fixed; top: -1000px; opacity: 0; }

  @media (max-width: 960px) {
    [data-ed][data-changed]::after { left: -8px; }
    #gutter button { background: var(--surface); }
    #ed-bar { right: 12px; bottom: 12px; }
  }

  @media print {
    #gutter, #ed-bar, .dec, .cmt-x { display: none; }
    [data-ed][data-changed]::after { background: #000; }
    .cmt { background: none; border-left: 2px solid #000; page-break-inside: avoid; }
    .cmt-in:empty { display: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" aria-label="Table of contents">
    <p class="sidebar-title">Contents</p>
    <ol>
      <li><a href="#s-first-section">First section</a></li>
      <li><a href="#s-second-section">Second section</a></li>
    </ol>
  </nav>
  <main>
<h1>__TITLE__</h1>
<p class="meta"><span class="kind">__KIND__</span><span class="sep">/</span>__META__</p>

<!--
  FILL INSTRUCTIONS (delete this comment in the output):
  - Replace __TITLE__, __KIND__ (1-2 word document type: Findings, Research, Review),
    and __META__ (short free-form line: scope, source counts, compiled date).
  - Sections follow the content's own shape: one <section id="s-<slug>"> per topic and
    one matching sidebar <li>, in the same order. Replace the two placeholder sections;
    add or remove freely. Never number section headings or TOC entries.
  - The TLDR block stays first: 3-6 bullets a reader could stop after.
  - Markup vocabulary: <p> for prose, <ol class="numbered"> only where rank carries
    meaning, <table> inside <div class="table-wrap"> for comparisons (class="num" on
    numeric cells, class="total" on a summary row), <div class="note"> for caveats and
    method asides, <blockquote> for quoted material, <pre><code> for multi-line code,
    <code> for identifiers, <figure class="chart"> for inline-SVG charts (CSS variables
    for all colors, aria-label on the <svg>, a <figcaption> stating the insight),
    <figure class="shot"> for base64-embedded images.
  - Keep it one self-contained file: no external CSS, fonts, scripts, or images.
  - The page is editable by default. You add no editor markup: the editor script at
    the end of the file finds every leaf text block itself. Two optional hooks exist, for documents that
    really are a list of discrete proposals:
      <div class="proposal" data-title="short stable label"> around each one, which
      is what turns on its accept/reject control, and inside it <p class="lbl">Before</p>
      <pre class="before"><code>..</code></pre> / <p class="lbl">After</p>
      <pre class="after"><code>..</code></pre>, where only the "after" half is editable.
    A <span class="loc"> after a proposal heading carries a file or line reference.
-->

<div class="tldr">
<p class="tldr-label">TL;DR</p>
<ul>
  <li></li>
</ul>
</div>

<section id="s-first-section">
<h2>First section</h2>
<p></p>
</section>

<section id="s-second-section">
<h2>Second section</h2>
<p></p>
</section>
  </main>
</div>

<script>
  const links = Array.from(document.querySelectorAll('.sidebar a'));
  const sections = links
    .map(l => document.getElementById(l.getAttribute('href').slice(1)))
    .filter(Boolean);

  if (sections.length) {
    let ticking = false;
    const sync = () => {
      ticking = false;
      const line = window.scrollY + window.innerHeight * 0.25;
      let index = 0;
      sections.forEach((s, i) => { if (s.offsetTop <= line) index = i; });
      if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
        index = sections.length - 1;
      }
      links.forEach((l, i) => l.classList.toggle('active', i === index));
    };
    addEventListener('scroll', () => {
      if (!ticking) { ticking = true; requestAnimationFrame(sync); }
    }, { passive: true });
    addEventListener('resize', sync, { passive: true });
    sync();
  }
</script>
<script id="editor">
  /* Inline editing + per-block comments. State lives in localStorage keyed by the
     file path, so a reload keeps it. "Copy" puts a JSON of only what was touched
     on the clipboard, to paste back into the chat. */
  (function () {
    const BLOCKS = 'h1,h2,h3,h4,h5,h6,p,li,td,th,dt,dd,figcaption,blockquote,summary';
    const SEL = BLOCKS + ',pre.after>code';
    const SKIP = 'nav,svg,#ed-bar,#gutter,.cmt';
    const KEY = 'tohtml:' + location.pathname;
    const main = document.querySelector('main');
    if (!main) return;

    const store = {
      read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
      write(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
      clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
    };

    const txt = el => el.innerText.replace(/\xa0/g, ' ').replace(/\s+$/, '');
    const quote = el => '\u201c' + el.dataset.fp +
      (el.dataset.orig.length > el.dataset.fp.length ? '\u2026' : '') + '\u201d';
    const orig = new Map();

    // Plain-text editing, with a paste guard where plaintext-only is unsupported
    function editable(el) {
      el.setAttribute('contenteditable', 'plaintext-only');
      if (el.contentEditable !== 'plaintext-only') {
        el.setAttribute('contenteditable', 'true');
        el.addEventListener('paste', e => {
          e.preventDefault();
          const t = (e.clipboardData || window.clipboardData).getData('text');
          document.execCommand('insertText', false, t);
        });
      }
    }

    // Every leaf text block, plus the "after" half of a before/after pair
    const blocks = [];
    const counts = {};
    main.querySelectorAll(SEL).forEach(el => {
      if (el.closest(SKIP)) return;
      if (el.matches('.meta,.tldr-label,.lbl')) return;
      if (el.querySelector(BLOCKS)) return;
      if (!el.textContent.trim()) return;
      const sec = el.closest('section[id]');
      const s = sec ? sec.id : (el.closest('.tldr') ? 'tldr' : 'head');
      counts[s] = (counts[s] || 0) + 1;
      el.dataset.ed = s + '#' + counts[s];
      el.dataset.orig = txt(el);
      el.dataset.fp = el.dataset.orig.slice(0, 60);
      orig.set(el, el.innerHTML);
      editable(el);
      el.addEventListener('input', () => {
        el.toggleAttribute('data-changed', txt(el) !== el.dataset.orig);
        save();
      });
      blocks.push(el);
    });

    // Accept/reject only exists when the document is a list of proposals
    const proposals = Array.from(main.querySelectorAll('.proposal'));
    proposals.forEach((pr, i) => {
      const h = pr.querySelector('h2,h3,h4,h5');
      pr.dataset.pid = pr.dataset.title || (h ? h.textContent.trim() : 'proposal ' + (i + 1));
      const row = document.createElement('div');
      row.className = 'dec';
      row.innerHTML = '<button type="button" value="accept">accept</button>' +
                      '<button type="button" value="reject">reject</button>';
      row.addEventListener('click', e => {
        const b = e.target.closest('button');
        if (b) setDec(pr, pr.dataset.dec === b.value ? '' : b.value);
      });
      pr.appendChild(row);
    });

    function setDec(pr, v) {
      if (v) pr.dataset.dec = v; else delete pr.dataset.dec;
      pr.querySelectorAll('.dec button').forEach(b => b.toggleAttribute('data-on', b.value === v));
      save();
    }

    // Comments
    function comment(el, value) {
      let box = el._cmt;
      if (!box) {
        box = document.createElement('div');
        box.className = 'cmt';
        const inTable = !!el.closest('table');
        box.innerHTML = '<div class="cmt-body">' +
          (inTable ? '<p class="cmt-q"></p>' : '') +
          '<div class="cmt-in" data-ph="Comment\u2026"></div></div>' +
          '<button type="button" class="cmt-x" title="Remove comment">\u00d7</button>';
        if (inTable) box.querySelector('.cmt-q').textContent = quote(el);
        const field = box.querySelector('.cmt-in');
        editable(field);
        field.addEventListener('input', save);
        box.querySelector('.cmt-x').addEventListener('click', () => {
          box.remove();
          el._cmt = null;
          save();
        });
        let ref = el.closest('table') ? (el.closest('.table-wrap') || el.closest('table')) : el;
        while (ref.nextElementSibling && ref.nextElementSibling.classList.contains('cmt')) {
          ref = ref.nextElementSibling;
        }
        ref.insertAdjacentElement('afterend', box);
        el._cmt = box;
      }
      const field = box.querySelector('.cmt-in');
      if (value) field.textContent = value;
      field.focus();
      return box;
    }

    // Floating gutter toolbar
    const gutter = document.createElement('div');
    gutter.id = 'gutter';
    gutter.innerHTML = '<button type="button" data-a="cmt" title="Comment">+</button>' +
                       '<button type="button" data-a="rev" title="Revert this block">\u21ba</button>';
    document.body.appendChild(gutter);
    let target = null;

    // Hover intent: the toolbar sits in the margin, so give the pointer time to
    // cross the gap between the block and it without the toolbar vanishing.
    let hideT;
    document.addEventListener('mouseover', e => {
      clearTimeout(hideT);
      if (e.target.closest('#gutter')) return;
      const el = e.target.closest('[data-ed]');
      if (!el) {
        hideT = setTimeout(() => {
          gutter.removeAttribute('data-on');
          target = null;
        }, 350);
        return;
      }
      target = el;
      const r = el.getBoundingClientRect();
      const tight = innerWidth <= 960;
      gutter.toggleAttribute('data-above', tight);
      gutter.style.top = (r.top + scrollY - (tight ? 24 : 0)) + 'px';
      gutter.style.left = (r.left + scrollX - (tight ? 0 : 8)) + 'px';
      gutter.querySelector('[data-a="rev"]').hidden = !el.hasAttribute('data-changed');
      gutter.setAttribute('data-on', '');
    });

    gutter.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || !target || !gutter.hasAttribute('data-on')) return;
      if (b.dataset.a === 'cmt') {
        comment(target);
      } else {
        target.innerHTML = orig.get(target);
        target.removeAttribute('data-changed');
        save();
      }
    });

    // Bar
    const bar = document.createElement('div');
    bar.id = 'ed-bar';
    bar.innerHTML = '<span id="ed-out"></span>' +
      '<button type="button" data-a="copy">Copy</button>' +
      '<button type="button" data-a="dl">Download</button>' +
      '<button type="button" data-a="reset">Reset</button>';
    document.body.appendChild(bar);
    const out = bar.querySelector('#ed-out');

    function collect() {
      const edits = [], comments = [], decisions = [];
      blocks.forEach(el => {
        const now = txt(el);
        if (now !== el.dataset.orig) {
          edits.push({ at: el.dataset.ed, was: el.dataset.fp, now, html: el.innerHTML });
        }
        if (el._cmt) {
          const v = el._cmt.querySelector('.cmt-in').innerText.trim();
          if (v) comments.push({ at: el.dataset.ed, on: el.dataset.fp, text: v });
        }
      });
      proposals.forEach(pr => {
        if (pr.dataset.dec) decisions.push({ item: pr.dataset.pid, decision: pr.dataset.dec });
      });
      return { doc: document.title, saved: new Date().toISOString(), edits, comments, decisions };
    }

    // The exported payload carries only what was touched, no restore-only fields
    function payload() {
      const d = collect();
      d.edits = d.edits.map(e => ({ at: e.at, was: e.was, now: e.now }));
      return JSON.stringify(d, null, 2);
    }

    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    let timer;

    function status() {
      const d = collect();
      const bits = [];
      if (d.edits.length) bits.push(plural(d.edits.length, 'edit'));
      if (d.comments.length) bits.push(plural(d.comments.length, 'comment'));
      if (proposals.length) bits.push(d.decisions.length + '/' + proposals.length + ' decided');
      out.textContent = bits.length ? bits.join(' \u00b7 ') : 'nothing changed yet';
      bar.toggleAttribute('data-dirty',
        !!(d.edits.length || d.comments.length || d.decisions.length));
    }

    function save() {
      status();
      clearTimeout(timer);
      timer = setTimeout(() => store.write(collect()), 300);
    }

    function flash(msg) {
      out.textContent = msg;
      clearTimeout(flash.t);
      flash.t = setTimeout(status, 2600);
    }

    async function copy() {
      const s = payload();
      let ok = false;
      try { await navigator.clipboard.writeText(s); ok = true; } catch (e) {}
      if (!ok) {
        const ta = document.createElement('textarea');
        ta.className = 'clip';
        ta.value = s;
        document.body.appendChild(ta);
        ta.select();
        try { ok = document.execCommand('copy'); } catch (e) {}
        ta.remove();
      }
      flash(ok ? 'copied \u2013 paste it back in the chat' : 'copy failed, use Download');
    }

    function download() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([payload()], { type: 'application/json' }));
      a.download = (document.title.toLowerCase().replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '') || 'report') + '-edits.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      flash('downloaded');
    }

    bar.addEventListener('click', e => {
      const a = (e.target.closest('button') || {}).dataset;
      if (!a) return;
      if (a.a === 'copy') copy();
      else if (a.a === 'dl') download();
      else if (a.a === 'reset') {
        if (!confirm('Discard all edits, comments and decisions?')) return;
        blocks.forEach(el => {
          el.innerHTML = orig.get(el);
          el.removeAttribute('data-changed');
          if (el._cmt) { el._cmt.remove(); el._cmt = null; }
        });
        proposals.forEach(pr => setDec(pr, ''));
        clearTimeout(timer);
        store.clear();
        status();
      }
    });

    // Restore, skipping anything whose block no longer matches (regenerated report)
    const saved = store.read();
    const find = a => blocks.find(b => b.dataset.ed === a.at && b.dataset.fp === (a.was || a.on));
    (saved.edits || []).forEach(e => {
      const el = find(e);
      if (!el) return;
      el.innerHTML = e.html !== undefined ? e.html : e.now;
      el.setAttribute('data-changed', '');
    });
    (saved.comments || []).forEach(c => {
      const el = find(c);
      if (el) comment(el, c.text).querySelector('.cmt-in').blur();
    });
    (saved.decisions || []).forEach(d => {
      const pr = proposals.find(x => x.dataset.pid === d.item);
      if (pr) setDec(pr, d.decision);
    });
    status();
  })();
</script>
</body>
</html>
